services:
  - type: web
    name: kari3
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kari3-postgres
          property: connectionString

databases:
  - name: kari3-postgres
    databaseName: kari3
    user: kari3
    plan: free
    postgresMajorVersion: "15"
    ipAllowList: []
